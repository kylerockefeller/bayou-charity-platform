name: Web Deploy Live Mirror (CF Workers)

on:
  push:
    branches: [mirror/live-as-is]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web-deploy-live-mirror.yml'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    name: Type-check → Build → Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (web)
        run: npm run type-check --workspace=apps/web

      - name: Refuse any worker other than the live mirror
        run: |
          set -euo pipefail
          cfg=apps/web/wrangler.jsonc
          grep -Eq '^[[:space:]]*"name": "bayou-charity-web-live",[[:space:]]*$' "$cfg"
          grep -Eq '^[[:space:]]*"service": "bayou-charity-web-live"[[:space:]]*$' "$cfg"
          if grep -E '"routes"|"route"|"custom_domain"|bayoucharity\.org' "$cfg"; then
            echo "refusing routes, custom domain, or zone reference"
            exit 1
          fi
          echo "worker name ok: bayou-charity-web-live, no routes"

      - name: Build & Deploy via OpenNext
        run: |
          set -o pipefail
          npm run deploy --workspace=apps/web 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          grep -q 'https://bayou-charity-web-live.' "$RUNNER_TEMP/deploy.log"
          if grep -E 'Uploaded bayou-charity-web \(|Deployed bayou-charity-web triggers' "$RUNNER_TEMP/deploy.log"; then
            echo "refusing: deploy targeted bayou-charity-web"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: bayou-charity
          SENTRY_PROJECT: bayou-web

      - name: Set Supabase service role secret
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name bayou-charity-web-live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
