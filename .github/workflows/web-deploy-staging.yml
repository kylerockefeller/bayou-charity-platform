name: Web Deploy Staging (CF Workers)

on:
  push:
    branches:
      - 'staging/**'
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web-deploy.yml'
      - '.github/workflows/web-deploy-staging.yml'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    name: Type-check → Build → Deploy staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (web)
        run: npm run type-check --workspace=apps/web

      - name: Build & Deploy via OpenNext
        working-directory: apps/web
        run: npx opennextjs-cloudflare build --env staging && npx opennextjs-cloudflare deploy --env staging
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: bayou-charity
          SENTRY_PROJECT: bayou-web

      # Staging only. Never reads the production service-role secret.
      # When the test key is missing, delete any key already on this Worker
      # so production credentials are not left bound to the test database.
      - name: Set or clear Supabase service role secret
        working-directory: apps/web
        run: |
          set -euo pipefail
          WORKER=bayou-charity-web-staging
          if [ -n "${TEST_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            printf '%s' "$TEST_SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name "$WORKER"
          else
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY is empty; not uploading a service role secret."
            if npx wrangler secret list --name "$WORKER" --format json | grep -Eq '"name"[[:space:]]*:[[:space:]]*"SUPABASE_SERVICE_ROLE_KEY"'; then
              echo "Removing SUPABASE_SERVICE_ROLE_KEY from ${WORKER}."
              npx wrangler secret delete SUPABASE_SERVICE_ROLE_KEY --name "$WORKER"
            else
              echo "No SUPABASE_SERVICE_ROLE_KEY on ${WORKER}."
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
